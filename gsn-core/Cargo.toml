[package]
name = "gsn-core"
version = "0.2.33"
edition = "2021"
description = "Agent Universe 核心库 v2.3.3: P2P 分布式网络层"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "gsn-daemon"
path = "src/bin/gsn-daemon.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.8"

[dev-dependencies]
