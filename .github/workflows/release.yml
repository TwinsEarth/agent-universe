name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gsn-core/target
          key: ${{ runner.os }}-release-cargo-${{ matrix.target }}-${{ hashFiles('gsn-core/Cargo.toml') }}

      - name: Build
        run: cd gsn-core && cargo build --release --target ${{ matrix.target }} --bin gsn-daemon

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd gsn-core/target/${{ matrix.target }}/release
          tar czf ../../../gsn-daemon-${{ matrix.target }}.tar.gz gsn-daemon
          ls -lh ../../../gsn-daemon-${{ matrix.target }}.tar.gz

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd gsn-core/target/${{ matrix.target }}/release
          Compress-Archive -Path gsn-daemon.exe -DestinationPath ../../../gsn-daemon-${{ matrix.target }}.zip
          ls -lh ../../../gsn-daemon-${{ matrix.target }}.zip

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} gsn-core/gsn-daemon-*.tar.gz gsn-core/gsn-daemon-*.zip --clobber

  python-sdk:
    name: Python SDK Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          cd aip-sdk-py && python -m build

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} aip-sdk-py/dist/* --clobber
