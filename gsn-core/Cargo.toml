[package]
name = "gsn-core"
version = "0.3.71"
edition = "2021"
# MSRV（W-01，v3.5.7）：锁定依赖中最高的 rust-version 是 time 0.3.x 家族要求的 1.88；
# 已用 rustc 1.88.0 实测 `cargo check --bins --locked` 通过。CI 有对应 MSRV 关卡。
# 仅约束库与二进制；测试/clippy 仍以 stable 运行。
rust-version = "1.88"
description = "Agent Universe 核心库 v3.7.1: 历史 Bug 回归套件 + 跨平台客户端 + CLI/REST/MCP - 群众化的 AGI 路线，去中心化的智能体共享 & 开源网络"
license = "MIT"
repository = "https://github.com/TwinsEarth/agent-universe"
homepage = "https://github.com/TwinsEarth/agent-universe"
documentation = "https://github.com/TwinsEarth/agent-universe/tree/main/docs"
keywords = ["p2p", "agent", "decentralized", "swarm", "libp2p"]
categories = ["concurrency", "network-programming"]
publish = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "gsn-daemon"
path = "src/bin/gsn-daemon.rs"

[[bin]]
name = "gsn"
path = "src/bin/gsn.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.8"
ed25519-dalek = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
libp2p = { version = "0.57", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "kad",
    "gossipsub",
    "identify",
    "dns",
    "request-response",
    "macros",
    "relay",
    "autonat",
    "dcutr",
    "ping",
    "rsa",
    "ed25519",
    # v2.5.4: WebSocket（含 wss/TLS），走 443 端口抗网络干扰，用于受限网络下稳定连 relay
    "websocket",
    # v2.5.5: QUIC（UDP），支持 UDP 打洞直连（方案 3），与 TCP/WS 共存
    "quic",
] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reed-solomon-erasure = "6.0.0"

# v3.6.1 自动更新：最小 HTTPS 能力（rustls + ring + webpki 根证书，无 native-tls/OpenSSL）。
# rustls 已由 libp2p(wss) 传递进依赖树并锁定同版本，直接声明为正式依赖不扩大依赖图。
# 注意：rustls 0.23 用的是 rustls-pki-types 1.x 的 TrustAnchor，因此根证书必须用
# webpki-roots 1.x（0.25 的自有 TrustAnchor 类型与 rustls 0.23 不兼容）。
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
webpki-roots = "1"

# v2.8.7：Windows Job Object（内存/进程数上限 + 整棵进程树随句柄关闭）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
