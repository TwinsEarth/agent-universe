[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aip-sdk"
version = "2.3.6"
authors = [{name = "Agent Universe", email = "twins-earth@users.noreply.github.com"}]
description = "Agent Interop Protocol SDK"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=41"]

[tool.setuptools.packages.find]
include = ["aip*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
