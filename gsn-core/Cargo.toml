[package]
name = "gsn-core"
version = "0.3.56"
edition = "2021"
description = "Agent Universe 核心库 v3.5.6: 历史 Bug 回归套件 + 跨平台客户端 + CLI/REST/MCP - 群众化的 AGI 路线，去中心化的智能体共享 & 开源网络"
license = "MIT"
repository = "https://github.com/TwinsEarth/agent-universe"
homepage = "https://github.com/TwinsEarth/agent-universe"
documentation = "https://github.com/TwinsEarth/agent-universe/tree/main/docs"
keywords = ["p2p", "agent", "decentralized", "swarm", "libp2p"]
categories = ["concurrency", "network-programming"]
publish = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "gsn-daemon"
path = "src/bin/gsn-daemon.rs"

[[bin]]
name = "gsn"
path = "src/bin/gsn.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.8"
ed25519-dalek = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "kad",
    "gossipsub",
    "identify",
    "dns",
    "request-response",
    "macros",
    "relay",
    "autonat",
    "dcutr",
    "ping",
    "rsa",
    "ed25519",
    # v2.5.4: WebSocket（含 wss/TLS），走 443 端口抗网络干扰，用于受限网络下稳定连 relay
    "websocket",
    # v2.5.5: QUIC（UDP），支持 UDP 打洞直连（方案 3），与 TCP/WS 共存
    "quic",
] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reed-solomon-erasure = "6.0.0"

# v2.8.7：Windows Job Object（内存/进程数上限 + 整棵进程树随句柄关闭）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
