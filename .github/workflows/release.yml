name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  gate:
    name: Pre-release Gate (tests + version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: Rust tests
        run: cd gsn-core && cargo test

      - name: Clippy
        run: cd gsn-core && cargo clippy --all-targets -- -D warnings

      # 在单一 gate（非并行 matrix）里确保 Release 已创建：所有 build/upload job 都 needs gate，
      # 因此它们 upload 时 Release 必然存在，根治并行 job 间"谁来建 Release"的竞态。
      # 与 publish.yml gate 跨工作流并发时，容忍 422 tag_name already exists。
      - name: Ensure Release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Ensuring release $VERSION exists before build/upload jobs..."
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            if ! gh release create "$VERSION" --title "Agent Universe $VERSION" \
                   --notes "Release $VERSION" 2>create_err.log; then
              if grep -qi "already exists" create_err.log; then
                echo "Release $VERSION 已由 publish.yml gate 并发创建，继续"
              else
                cat create_err.log; exit 1
              fi
            fi
          else
            echo "Release $VERSION already exists"
          fi

  build:
    needs: gate
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gsn-core/target
          key: ${{ runner.os }}-release-cargo-${{ matrix.target }}-${{ hashFiles('gsn-core/Cargo.toml') }}

      - name: Build
        run: cd gsn-core && cargo build --release --target ${{ matrix.target }} --bin gsn-daemon

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd gsn-core/target/${{ matrix.target }}/release
          OUT="$GITHUB_WORKSPACE/gsn-core/gsn-daemon-${{ matrix.target }}.tar.gz"
          tar czf "$OUT" gsn-daemon
          ls -lh "$OUT"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $src = "gsn-core/target/${{ matrix.target }}/release/gsn-daemon.exe"
          $dst = "gsn-core/gsn-daemon-${{ matrix.target }}.zip"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path $src -DestinationPath $dst
          Get-Item $dst | Select-Object FullName, Length

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          if [ "${{ matrix.archive }}" = "zip" ]; then
            files=( gsn-core/gsn-daemon-*.zip )
          else
            files=( gsn-core/gsn-daemon-*.tar.gz )
          fi
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no artifact found for ${{ matrix.target }}"; exit 1; fi
          echo "Uploading: ${files[*]}"
          gh release upload ${{ github.ref_name }} "${files[@]}" --clobber

  python-sdk:
    needs: gate
    name: Python SDK Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          cd aip-sdk-py && python -m build
          ls -lh dist/

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=( aip-sdk-py/dist/* )
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no python artifacts in aip-sdk-py/dist"; exit 1; fi
          echo "Uploading: ${files[*]}"
          gh release upload ${{ github.ref_name }} "${files[@]}" --clobber
