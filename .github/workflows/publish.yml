name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v2.3.4)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: Build & Upload Packages
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set crate version from tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          CRATE_VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $CRATE_VERSION"
          cd gsn-core
          # 跨平台兼容 sed（Linux 和 macOS）
          sed -i.bak "s/^version = .*/version = \"$CRATE_VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak
          grep '^version' Cargo.toml

      - name: Ensure Release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Creating release $VERSION..."
            gh release create "$VERSION" --title "Agent Universe $VERSION" \
              --notes "Release $VERSION"
          else
            echo "Release $VERSION already exists"
          fi

      - name: Build release binary
        run: cd gsn-core && cargo build --release

      - name: Package binary
        shell: bash
        run: |
          cd gsn-core/target/release
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ARCH="macos-arm64"
          else
            ARCH="linux-x64"
          fi
          tar -czf gsn-daemon-${ARCH}-${VERSION}.tar.gz gsn-daemon
          ls -la gsn-daemon-*.tar.gz

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gsn-core/target/release
          for f in gsn-daemon-*.tar.gz; do
            echo "Uploading $f..."
            gh release upload "$VERSION" "$f" --clobber
          done

  build-python:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Set package version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          CRATE_VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cd aip-sdk-py
          sed -i.bak "s/^version = .*/version = \"$CRATE_VERSION\"/" pyproject.toml
          rm -f pyproject.toml.bak

      - name: Ensure Release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Creating release $VERSION..."
            gh release create "$VERSION" --title "Agent Universe $VERSION" \
              --notes "Release $VERSION"
          fi

      - name: Build wheel
        run: cd aip-sdk-py && python -m build --wheel

      - name: Upload wheel to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd aip-sdk-py/dist
          for f in *.whl; do
            echo "Uploading $f..."
            gh release upload "$VERSION" "$f" --clobber
          done

  npm-publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build-and-upload
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Configure registry auth
        id: tok
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret not set; npm cannot be published for this release tag. Add an npm Automation token at repo Settings -> Secrets and variables -> Actions -> NPM_TOKEN, then re-run this job."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve version (tag push or manual dispatch)
        id: ver
        if: steps.tok.outputs.ready == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          VER="${VER#v}"
          echo "resolved=$VER" >> "$GITHUB_OUTPUT"

      - name: Verify version matches
        if: steps.tok.outputs.ready == 'true'
        run: |
          TAG="${{ steps.ver.outputs.resolved }}"
          PKG=$(node -p "require('./package.json').version")
          echo "expected=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then echo "::error::package.json version $PKG != $TAG"; exit 1; fi

      - name: Publish to npm
        if: steps.tok.outputs.ready == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
