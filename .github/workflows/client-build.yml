name: Client Build

# 打版本 tag（如 v2.3.6）时自动构建各平台 Tauri 客户端与 Android APK，
# 并发布到对应 GitHub Release。iOS 需 Apple 开发者证书，不在此产出（见 client/ios）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            ext: "dmg app"
          - platform: windows
            os: windows-latest
            ext: "msi"
          - platform: linux
            os: ubuntu-latest
            ext: "deb AppImage"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libappindicator3-dev \
            patchelf file

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Build Tauri bundle
        working-directory: client
        run: npx tauri build

      - name: Upload to Release (macOS)
        if: matrix.platform == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/macos/*.app

      - name: Upload to Release (Windows)
        if: matrix.platform == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload to Release (Linux)
        if: matrix.platform == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/appimage/*.AppImage

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 覆盖 action 默认的遗留 'tools' 包（新版 cmdline-tools 已移除，安装会失败）
          packages: "platform-tools"

      - name: Install NDK
        run: yes | sdkmanager --licenses >/dev/null 2>&1; sdkmanager "ndk;27.2.12479018" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file build-essential

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Initialize Android project
        working-directory: client
        run: npx tauri android init || true

      - name: Build APK
        working-directory: client
        # --debug：AGP 用调试密钥自动签名，产出可直接侧载安装的 APK；
        # 开源仓库未内置 release keystore，上架商店需另配签名（见 client/platforms/android.md）
        run: npx tauri android build --apk --debug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
