name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  gate:
    name: Pre-release Gate (tests + version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: Rust tests
        run: cd gsn-core && cargo test

      - name: Clippy
        run: cd gsn-core && cargo clippy --all-targets -- -D warnings

      # 在单一 gate（非并行 matrix）里确保 Release 已创建：所有 build/upload job 都 needs gate，
      # 因此它们 upload 时 Release 必然存在，根治并行 job 间"谁来建 Release"的竞态。
      # 与 publish.yml gate 跨工作流并发时，容忍 422 tag_name already exists。
      - name: Ensure Release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Ensuring release $VERSION exists before build/upload jobs..."
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            if ! gh release create "$VERSION" --title "Agent Universe $VERSION" \
                   --notes "Release $VERSION" 2>create_err.log; then
              if grep -qi "already exists" create_err.log; then
                echo "Release $VERSION 已由 publish.yml gate 并发创建，继续"
              else
                cat create_err.log; exit 1
              fi
            fi
          else
            echo "Release $VERSION already exists"
          fi

  build:
    needs: gate
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gnu 在 ubuntu-latest 上用 cargo-zigbuild 以 glibc 2.35 为目标交叉编译，而不是再钉
          # ubuntu-22.04 runner：该镜像 2026-10 已在退役、hosted runner 多次无法分配（v3.6.3 的
          # gnu job 等满 15 分钟后被判定 "job was not acquired by hosted runner"）。zigbuild 产出
          # 仍是动态链接、glibc 依赖 <= 2.35 的 gnu 二进制，老发行版可直接运行，且输出仍落在标准
          # target/x86_64-unknown-linux-gnu/ 目录。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # 额外提供 musl 静态二进制：无 glibc 依赖，覆盖 Alpine/无 glibc 环境；
          # 更新器仅在自身为 musl 编译(target_env=musl)时选择该资产。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version | head -1

      - name: Install cargo-zigbuild + zig (gnu -> glibc 2.35)
        if: contains(matrix.target, '-linux-gnu')
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip3 install --user cargo-zigbuild ziglang
          mkdir -p "$HOME/.local/bin"
          # ziglang 通常装好即提供 ~/.local/bin/zig；个别版本无 console_script，则从包目录取二进制做软链。
          if ! command -v zig >/dev/null 2>&1; then
            ZIGPY="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
            test -x "$ZIGPY"
            ln -sf "$ZIGPY" "$HOME/.local/bin/zig"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v cargo-zigbuild && cargo-zigbuild --version
          command -v zig && zig version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gsn-core/target
          key: ${{ runner.os }}-release-cargo-${{ matrix.target }}-${{ hashFiles('gsn-core/Cargo.toml') }}

      - name: Build (gnu, zigbuild targeting glibc 2.35)
        if: contains(matrix.target, '-linux-gnu')
        run: |
          set -euo pipefail
          cd gsn-core
          # cargo-zigbuild 以 glibc 2.35 为目标；产物仍输出到 target/x86_64-unknown-linux-gnu/。
          cargo zigbuild --release --target "x86_64-unknown-linux-gnu.2.35" --bin gsn-daemon

      - name: Build (musl / macOS / Windows)
        if: ${{ !contains(matrix.target, '-linux-gnu') }}
        env:
          # ring 在 musl 目标下通过 musl-gcc 链接其 C/汇编；mac/win 忽略此变量。
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cd gsn-core && cargo build --release --target ${{ matrix.target }} --bin gsn-daemon

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd gsn-core/target/${{ matrix.target }}/release
          OUT="$GITHUB_WORKSPACE/gsn-core/gsn-daemon-${{ matrix.target }}.tar.gz"
          tar czf "$OUT" gsn-daemon
          ls -lh "$OUT"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $src = "gsn-core/target/${{ matrix.target }}/release/gsn-daemon.exe"
          $dst = "gsn-core/gsn-daemon-${{ matrix.target }}.zip"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path $src -DestinationPath $dst
          Get-Item $dst | Select-Object FullName, Length

      # v3.6.1 自动更新：除压缩包外，额外产出"原始可执行文件 + .sha256 摘要"。
      # 更新器直下原始二进制→校验 sha256→原子替换，免在目标机解包（依赖树无 tar/zip 解包库）。
      # 资产名必须与 gsn-core/src/update/registry.rs::platform_asset_name 完全一致。
      - name: Stage raw binary + sha256 (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          REL="gsn-core/target/${{ matrix.target }}/release"
          RAW="gsn-daemon-${{ matrix.target }}"
          cp "$REL/gsn-daemon" "gsn-core/$RAW"
          chmod 0755 "gsn-core/$RAW"
          ( cd gsn-core && sha256sum "$RAW" > "$RAW.sha256" )
          ls -lh "gsn-core/$RAW" "gsn-core/$RAW.sha256"
          cat "gsn-core/$RAW.sha256"

      - name: Stage raw binary + sha256 (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $src = "gsn-core/target/${{ matrix.target }}/release/gsn-daemon.exe"
          $raw = "gsn-daemon-${{ matrix.target }}.exe"
          Copy-Item $src "gsn-core/$raw" -Force
          $hash = (Get-FileHash "gsn-core/$raw" -Algorithm SHA256).Hash.ToLower()
          # sha256sum 风格："<hash>  <filename>"，更新器取首个空白前字段。
          "$hash  $raw" | Set-Content -NoNewline "gsn-core/$raw.sha256" -Encoding ascii
          Get-Item "gsn-core/$raw", "gsn-core/$raw.sha256" | Select-Object FullName, Length
          Get-Content "gsn-core/$raw.sha256"

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE" = "zip" ]; then
            files=(
              "gsn-core/gsn-daemon-$TARGET.zip"
              "gsn-core/gsn-daemon-$TARGET.exe"
              "gsn-core/gsn-daemon-$TARGET.exe.sha256"
            )
          else
            files=(
              "gsn-core/gsn-daemon-$TARGET.tar.gz"
              "gsn-core/gsn-daemon-$TARGET"
              "gsn-core/gsn-daemon-$TARGET.sha256"
            )
          fi
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "::error::missing artifact: $f"; exit 1; fi
          done
          echo "Uploading: ${files[*]}"
          gh release upload ${{ github.ref_name }} "${files[@]}" --clobber

  python-sdk:
    needs: gate
    name: Python SDK Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          cd aip-sdk-py && python -m build
          ls -lh dist/

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=( aip-sdk-py/dist/* )
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no python artifacts in aip-sdk-py/dist"; exit 1; fi
          echo "Uploading: ${files[*]}"
          gh release upload ${{ github.ref_name }} "${files[@]}" --clobber
