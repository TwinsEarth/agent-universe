name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-test:
    name: Rust - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build
        run: cd gsn-core && cargo build --verbose

      - name: Test
        run: cd gsn-core && cargo test --verbose

      - name: Clippy
        run: cd gsn-core && cargo clippy --all-targets -- -D warnings

      - name: Run gsn-daemon --help
        run: cd gsn-core && cargo run --bin gsn-daemon -- --help

  python-test:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography
          pip install aip-sdk-py/

      - name: Run tests
        run: |
          cd aip-sdk-py
          PYTHONPATH=. pytest tests/ -v | tee /tmp/py.out
          if grep -q " SKIPPED" /tmp/py.out; then
            echo "::error::存在被静默跳过的 Python 测试（核心跨语言签名测试必须真正执行）"
            exit 1
          fi

  js-test:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JS SDK tests
        run: node js/test/test.js

      - name: Verify root package re-export
        run: node -e "const au=require('./'); if(au.version!=='2.7.6') process.exit(1); console.log('root package OK, version', au.version)"

      - name: Run historical-bug regression suite
        run: node test/regression.js

  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert all version declarations match VERSION
        run: bash scripts/check-version.sh

  contracts-check:
    name: Solidity Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Hardhat
        working-directory: contracts
        run: npm install

      - name: Compile & run per-defect tests (GAP §9.4)
        working-directory: contracts
        run: npx hardhat test
