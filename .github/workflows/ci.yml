name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-test:
    name: Rust - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 固定 Node 版本：沙箱 JS 测试用 node；runner 预装 node 随镜像漂移（新版
      # V8 虚拟预留更大，导致 ulimit -v 下启动失败）。固定版本保证可复现。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # 统一用 Swatinem/rust-cache@v2：自动按 Cargo.lock 指纹缓存 registry/依赖/
      # 编译产物（替代旧 actions/cache，key 自动含 lockfile，命中率更高且免手写 key）。
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gsn-core

      # 关卡顺序：格式 → 静态检查 → 测试 → 发布构建。
      - name: Rustfmt
        run: cargo fmt --all -- --check
        working-directory: gsn-core

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: gsn-core

      - name: Test
        run: cargo test --workspace
        working-directory: gsn-core

      - name: Release build
        run: cargo build --release --workspace
        working-directory: gsn-core

      - name: Run gsn-daemon --help
        run: cargo run --bin gsn-daemon -- --help
        working-directory: gsn-core

  # MSRV 关卡（W-01，v3.5.7）：gsn-core 的最低支持工具链是声明且实测的 1.88.0——
  # 下限来自锁定依赖中最高的 rust-version（time 0.3.x 家族要求 1.88），不是猜的。
  # 仅保证「库 + 两个二进制」在该工具链可编译；测试与 clippy 仍以 stable 运行
  # （部分 dev-dependency 可能需要更新的编译器，这不应抬高发布产物的 MSRV）。
  rust-msrv:
    name: Rust MSRV 1.88.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88.0"

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gsn-core
          # MSRV 关卡独立缓存 key，避免与 stable job 的编译产物互相污染。
          prefix-key: "msrv-1.88"

      - name: Check library and bins under MSRV
        run: cargo check --bins --locked
        working-directory: gsn-core

  workbench-check:
    name: Workbench Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libappindicator3-dev \
            patchelf file

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  python-test:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography
          pip install aip-sdk-py/

      - name: Run tests
        run: |
          cd aip-sdk-py
          PYTHONPATH=. pytest tests/ -v | tee /tmp/py.out
          if grep -q " SKIPPED" /tmp/py.out; then
            echo "::error::存在被静默跳过的 Python 测试（核心跨语言签名测试必须真正执行）"
            exit 1
          fi

  js-test:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JS SDK tests
        run: node js/test/test.js

      - name: Verify root package re-export
        run: node -e "const au=require('./'); if(au.version!=='3.9.11') process.exit(1); console.log('root package OK, version', au.version)"

      - name: Run historical-bug regression suite
        run: node test/regression.js

  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert all version declarations match VERSION
        run: bash scripts/check-version.sh

  contracts-check:
    name: Solidity Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Hardhat
        working-directory: contracts
        run: npm install

      - name: Compile & run per-defect tests (GAP §9.4)
        working-directory: contracts
        run: npx hardhat test

  static-gates:
    name: Static Gates (panics / unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 剥离注释/字符串/char 后扫描生产代码：禁止 .unwrap()/.expect()/panic!/
      # unreachable!/todo!/unimplemented!（#[cfg(test)] 除外）。
      - name: No panic paths in production code
        run: node scripts/check-no-panics.mjs
      # 每个 unsafe 块必须收容在平台模块且有对应 // SAFETY: 理由。
      - name: Unsafe code is contained and justified
        run: node scripts/check-unsafe-containment.mjs
