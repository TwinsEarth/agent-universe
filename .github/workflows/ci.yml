name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-test:
    name: Rust - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 固定 Node 版本：沙箱 JS 测试用 node；runner 预装 node 随镜像漂移（新版
      # V8 虚拟预留更大，导致 ulimit -v 下启动失败）。固定版本保证可复现。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Rustfmt
        run: cd gsn-core && cargo fmt --check

      - name: Build
        run: cd gsn-core && cargo build --verbose

      - name: Test
        run: cd gsn-core && cargo test --verbose

      - name: Clippy
        run: cd gsn-core && cargo clippy --all-targets -- -D warnings

      - name: Run gsn-daemon --help
        run: cd gsn-core && cargo run --bin gsn-daemon -- --help

  workbench-check:
    name: Workbench Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libappindicator3-dev \
            patchelf file

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  python-test:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography
          pip install aip-sdk-py/

      - name: Run tests
        run: |
          cd aip-sdk-py
          PYTHONPATH=. pytest tests/ -v | tee /tmp/py.out
          if grep -q " SKIPPED" /tmp/py.out; then
            echo "::error::存在被静默跳过的 Python 测试（核心跨语言签名测试必须真正执行）"
            exit 1
          fi

  js-test:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JS SDK tests
        run: node js/test/test.js

      - name: Verify root package re-export
        run: node -e "const au=require('./'); if(au.version!=='3.4.0') process.exit(1); console.log('root package OK, version', au.version)"

      - name: Run historical-bug regression suite
        run: node test/regression.js

  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert all version declarations match VERSION
        run: bash scripts/check-version.sh

  contracts-check:
    name: Solidity Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Hardhat
        working-directory: contracts
        run: npm install

      - name: Compile & run per-defect tests (GAP §9.4)
        working-directory: contracts
        run: npx hardhat test

  static-gates:
    name: Static Gates (panics / unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 剥离注释/字符串/char 后扫描生产代码：禁止 .unwrap()/.expect()/panic!/
      # unreachable!/todo!/unimplemented!（#[cfg(test)] 除外）。
      - name: No panic paths in production code
        run: node scripts/check-no-panics.mjs
      # 每个 unsafe 块必须收容在平台模块且有对应 // SAFETY: 理由。
      - name: Unsafe code is contained and justified
        run: node scripts/check-unsafe-containment.mjs
