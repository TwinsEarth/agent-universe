name: Client Build

# 客户端（桌面三平台 + Android APK）**不随每个版本 tag 构建**。
# 节奏：仅在「大版本」（v2.7.0 起，约每 9 个小版本）通过手动 workflow_dispatch
# 构建一次，并上传到该大版本 Release；中间小版本复用已有客户端，不重复构建。
# 触发：gh workflow run client-build.yml -f release_tag=vX.Y.0
#
# 桌面主交付物为「Agent Universe Workbench」工作台（desktop/，v2.9.0 起）；
# 旧的极简客户端 client/ 仅同步版本号、保留全平台精简形态。
# Android 仍由 client/ 的 Tauri 工程产出（desktop 暂无移动端配置）。
# iOS 需 Apple 开发者证书，不在此产出（见 client/platforms/ios.md）。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "目标大版本 Release tag（必填，如 v2.9.0）"
        required: true
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  workbench:
    name: Workbench - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libappindicator3-dev \
            patchelf file

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Build Tauri bundle
        working-directory: desktop
        run: npx tauri build

      - name: Upload to Release (macOS)
        if: matrix.platform == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app

      - name: Upload to Release (Windows)
        if: matrix.platform == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload to Release (Linux)
        if: matrix.platform == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 覆盖 action 默认的遗留 'tools' 包（新版 cmdline-tools 已移除，安装会失败）
          packages: "platform-tools"

      - name: Install NDK
        run: yes | sdkmanager --licenses >/dev/null 2>&1; sdkmanager "ndk;27.2.12479018" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file build-essential

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Initialize Android project (clean regen)
        working-directory: client
        # gen/android 已存在时，增量 init 会用当前 CLI 模板覆盖部分 buildSrc 文件，
        # 造成新版 BuildTask（含必填 projectDir 输入）与旧版 RustPlugin（不赋值）混搭、
        # Gradle 校验报 "property 'projectDir' has no configured value"。
        # 先删除再全新生成，保证 buildSrc 与当前 CLI 完全配套。
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init

      - name: Build APK
        working-directory: client
        # --debug：AGP 用调试密钥自动签名，产出可直接侧载安装的 APK；
        # 开源仓库未内置 release keystore，上架商店需另配签名（见 client/platforms/android.md）
        run: npx tauri android build --apk --debug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
